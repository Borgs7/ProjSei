<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeiScanPH - Earthquake Hazard Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>🌏 SeiScanPH</h1>
        <p>Earthquake Hazard Mapping for the Philippines</p>
    </header>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Info Panel -->
<div class="info-panel" id="info-panel">
    <button class="minimize-btn" id="minimize-btn" onclick="toggleInfoPanel()">−</button>
    <div id="panel-content">
        <h2>M 7.1 Calapan Earthquake</h2>
        <p>Peak Ground Acceleration (PGA) Map</p>
        <div id="map-info">
            <p>Loading map data...</p>
        </div>
    </div>
</div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Georaster libraries for loading GeoTIFF -->
    <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
    
    <!-- Your map JavaScript -->
    <script src="js/map.js"></script>
    <script src="js/click-calculator.js"></script>

    
    <!-- Info Panel Toggle Script -->
    <script>
        function toggleInfoPanel() {
            const panel = document.getElementById('info-panel');
            const btn = document.getElementById('minimize-btn');
            
            panel.classList.toggle('minimized');
            
            if (panel.classList.contains('minimized')) {
                btn.innerHTML = '+';
                btn.title = 'Expand panel';
            } else {
                btn.innerHTML = '−';
                btn.title = 'Minimize panel';
            }
        }
    </script>
</body>
</html>
